appId: com.zapkstart.app
productName: zApkStart
copyright: Copyright (c) 2026 ApkStart contributors, (c) 2026 zApkStart contributors

directories:
  output: dist/release
  buildResources: build

# 只带运行需要的文件，源码目录整块进包（无 asar：窗口代理要用真实的 .ps1 路径）
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # 运行时解压 .xz 镜像用（NAPI 预编译，无 ABI 问题）。
  # x64 与 arm64 两个预编译都带：electron-builder 没有 per-arch files 过滤，
  # 两个平台各自的 napi 二进制只有约 100KB 级别，运行时 process.arch 自动选对的那份。
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "node_modules/@napi-rs/lzma-win32-arm64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# 只保留用到的界面语言（Electron locales 从 41MB 降到 ~4MB）。
# he = 希伯来语（zApkStart 新增）。注意 build/pack.js 的 KEEP_LOCALES 是**另一份**
# 过滤清单（管便携包），两处必须同步改。
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - he

# 完整运行时（emulator + platform-tools + 系统镜像），由 build/prepare-runtime.js 生成。
# 打进包里之后首次启动不再需要任何下载。
# 内容是 x64 的（Google 不发布 Windows-ARM64 模拟器）——因此 ARM64 目标**不带**
# extraResources：arm64 包是运行时无关的轻量壳，首次启动按 arch 引导下载。
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

# ---------------- 便携 zip（arm64 运行时无关包） ----------------
# zip 目标没有独立配置段：产物名由 CI 的 arm64 作业用 -c.artifactName 指定
# （${productName}-${version}-win64-arm64-portable.zip），本地等价命令见 README。

win:
  # x64：NSIS 安装包（与上游一致的完整体验）。
  # arm64：NSIS + zip。CI 的 arm64 作业用 electron-builder 交叉编译（x64 runner 即可），
  # 产物用 scripts/check-pe-arch.js 验证 Machine == ARM64。
  target:
    - target: nsis
      arch:
        - x64
    - target: nsis
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: src/ui/assets/appicon.ico
  # 安装到当前用户目录，不写系统盘、不要求管理员权限
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store（MSIX） ----------------
# zApkStart fork 不发布商店版本：上游的 Partner Center 身份（RoutineMiku.ApkStart /
# CN=58CA1DED-…）属于原作者，fork 使用它就是冒充。appx 配置整段移除；
# 本地自签名测试包仍可用 `npm run build:msix`（build/msix.js，身份走环境变量覆盖）。
# 若未来要上架，先注册自己的 Partner Center 身份再补回这段配置。

nsis:
  # 标准向导，允许选择安装位置（装到非系统盘可减轻 C 盘压力；运行时数据目录另在设置里单独指定）。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # zApkStart 面向英语/希伯来语用户：安装向导跟随系统语言，并允许手动选择。
  displayLanguageSelector: true
  installerLanguages:
    - en_US
    - he_IL
  # always：即使桌面上已有同名 .lnk 也重建一次。
  # 默认的 true 只在「不存在」时才创建，某些机器上（安全软件拦截、桌面被
  # OneDrive 重定向、旧版残留了指向已删目录的坏快捷方式）会出现装完没图标，
  # 或者图标还指着旧 exe。always 保证每次安装后都指向当前安装目录。
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # ${arch} 区分 x64 / arm64 安装包（updater 按本机二进制架构挑选资产）。
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
  # 卸载前先结束仍在运行的运行时进程，避免文件被锁导致无法删除
  include: build/installer.nsh
  # 安装包本身已含完整运行时（emulator + 系统镜像 .gz），装完首次启动
  # 自动把镜像展开到用户目录，之后不再联网下载任何东西。（x64 安装包如此；
  # arm64 包不含运行时，见上面 extraResources 的说明。）

# 压缩级别：normal（zlib）。镜像本身已是 xz/gz，NSIS 这层只压 Electron 的 dll，
# normal 与 maximum 体积差别很小，但 maximum(LZMA) 会让打安装包慢十几分钟。
compression: normal

# ---------------- Linux / FydeOS ----------------
# zApkStart fork 只维护 Windows。上游的 Linux/AppImage 目标保留在此仅为
# 构建配置不报错（README 已声明 fork 不支持 Linux）；不测试、不维护。
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: zApkStart
      Comment: Run Android apps on the desktop
      Categories: Utility;
